name: Release

# Pushing a tag like v1.0.0 builds the app and publishes it on the Releases tab.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build universal app
        run: VERSION="${GITHUB_REF_NAME#v}" Scripts/build-app.sh --arch arm64 --arch x86_64

      - name: Zip app
        # ditto keeps the bundle's code signature and metadata intact.
        run: ditto -c -k --keepParent build/AwakeTray.app "AwakeTray-$GITHUB_REF_NAME.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # Re-pushing an existing tag replaces the download on its release.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "AwakeTray-$GITHUB_REF_NAME.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "AwakeTray-$GITHUB_REF_NAME.zip" --title "AwakeTray $GITHUB_REF_NAME" --generate-notes
          fi
